<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Integrated Tables</title>
  <style>
    .table-container { display: none; margin-top: 20px; }
  </style>
</head>
<body>

  <h2>Select an Option</h2>

  <select id="options">
    <option value="">--Select--</option>
    <option value="1">Option 1</option>
    <option value="2">Option 2</option>
    <option value="3">Option 3</option>
    <option value="4">Option 4</option>
    <option value="5">Option 5</option>
    <option value="6">Option 6</option>
  </select>

  <button onclick="showTable()">Next</button>

  <!-- Tables wrapped in divs -->
  <div class="table-container" id="table1">
    <!-- Your full table HTML for Option 1 goes here -->
  </div>

  <div class="table-container" id="table2">
    <!-- Your full table HTML for Option 2 goes here -->
  </div>

  <div class="table-container" id="table3">
    <!-- Your full table HTML for Option 3 goes here -->
  </div>

  <div class="table-container" id="table4">
    <!-- Your full table HTML for Option 4 goes here -->
  </div>

  <div class="table-container" id="table5">
    <!-- Your full table HTML for Option 5 goes here -->
  </div>

  <div class="table-container" id="table6">
    <!-- Your full table HTML for Option 6 goes here -->
  </div>

  <script>
    function showTable() {
      const option = document.getElementById("options").value;

      // Hide all tables first
      for (let i = 1; i <= 6; i++) {
        document.getElementById("table" + i).style.display = "none";
      }

      // Show selected table
      if (option) {
        document.getElementById("table" + option).style.display = "block";
      } else {
        alert("Please select an option.");
      }
    }
  </script>

</body>
</html>
